# Runs when a pull request from dev or hotfix is merged into main (a push to main):
#   1. tags the merge commit with the version in package.json (vX.Y.Z), if that tag does not exist yet;
#   2. brings main into hotfix, so the next urgent fix starts from the released code;
#   3. reminds you to bring main into dev by hand (the dev rules require pull requests, so the workflow cannot push
#      there; a repository admin can: git checkout dev && git pull && git merge origin/main && git push).
# The version and the CHANGELOG are prepared on dev / hotfix before the pull request (release.js prepare), and the
# Release check blocks the pull request until they are right. The VSIX is built and uploaded to the Marketplace by
# hand from main (see CONTRIBUTING.md, "Release steps").
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$(git rev-parse "v$VERSION^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "v$VERSION already tags this commit."
            else
              echo "::warning::main changed, but v$VERSION is already tagged on an earlier commit: no new tag. Merge into main only through a release pull request with a new version."
            fi
            exit 0
          fi
          git tag -a "v$VERSION" -m "FileStudio v$VERSION"
          git push origin "v$VERSION"
          echo "::notice::Tagged v$VERSION. Build the VSIX from main and upload it on https://marketplace.visualstudio.com/manage/publishers/yokeeswaran (… → Update)."

      # Not fatal: when hotfix has commits that conflict with main, merge main into it by hand.
      - name: Bring main into hotfix
        continue-on-error: true
        run: |
          if ! git ls-remote --exit-code --heads origin hotfix >/dev/null; then
            echo "hotfix does not exist: skipped."
            exit 0
          fi
          git fetch origin hotfix
          git checkout -q -B hotfix origin/hotfix
          if git merge --no-edit origin/main && git push origin hotfix; then
            echo "hotfix is up to date with main."
          else
            git merge --abort 2>/dev/null || true
            echo "::warning::Could not bring main into hotfix (a conflict). Run: git checkout hotfix && git pull && git merge origin/main && git push"
          fi

      - name: Reminder - bring main into dev
        run: |
          git fetch origin dev 2>/dev/null || exit 0
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already has everything on main."
          else
            echo "::notice::Bring main into dev: git checkout dev && git pull && git merge origin/main && git push"
          fi
